name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Tipo de Release (SemVer)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - prerelease
      npm_tag:
        description: "NPM Distribution Tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
          - beta
      dry_run:
        description: "Executar em modo Dry Run (apenas simula, sem publicar no NPM)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint and typecheck
        run: npm run lint

      - name: Run automated tests
        run: npm run test

      - name: Build package
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: versioning
        run: |
          NEW_VERSION=$(npm version ${{ inputs.release_type }} -m "chore(release): %s [skip ci]")
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Nova versão gerada: ${NEW_VERSION}"

      - name: Publish to NPM (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "Simulando publicação no NPM (Dry-Run ativo)..."
          npm publish --dry-run --access public --tag ${{ inputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM
        if: ${{ !inputs.dry_run }}
        run: |
          npm publish --access public --tag ${{ inputs.npm_tag }}
          git push origin HEAD:main --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: "Release ${{ steps.versioning.outputs.version }}"
          generate_release_notes: true
